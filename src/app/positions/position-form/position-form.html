<div class="page-container">
  <form class="position-form" (ngSubmit)="onSubmit()" #posForm="ngForm">
    <h2>{{ isEdit ? 'Редактировать должность' : 'Создать должность' }}</h2>

    @if (fetchLoading()) {
      <p class="status">Загрузка...</p>
    } @else {
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <div class="field">
        <label for="name">Название <span class="required">*</span></label>
        <input id="name" type="text" name="name" [(ngModel)]="name" required placeholder="Администратор" />
      </div>

      <div class="permissions-section">
        <p class="permissions-title">Права доступа</p>

        @for (mod of permissionsConfig; track mod.key) {
          <div class="permission-module">
            <label class="module-header">
              <input
                type="checkbox"
                [checked]="isModuleAllChecked(mod)"
                (change)="toggleModule(mod)"
              />
              <span class="module-name">{{ mod.module }}</span>
            </label>

            <div class="module-actions">
              @for (action of mod.actions; track action.key) {
                <label class="action-label">
                  <input
                    type="checkbox"
                    [checked]="isChecked(mod.key, action.key)"
                    (change)="togglePermission(mod.key, action.key)"
                  />
                  {{ action.label }}
                </label>
              }
            </div>
          </div>
        }
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Отмена</button>
        <button type="submit" [disabled]="posForm.invalid || loading()">
          {{ loading() ? 'Сохранение...' : (isEdit ? 'Сохранить' : 'Создать') }}
        </button>
      </div>
    }
  </form>
</div>
