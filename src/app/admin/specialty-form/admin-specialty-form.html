<!-- Page header -->
<div class="page-head">
  <div class="page-head-left">
    <button class="btn-back" type="button" (click)="cancel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div>
      <h1 class="page-title">{{ isEdit ? 'Edit specialty' : 'New specialty' }}</h1>
      <p class="page-sub">{{ isEdit ? 'Update the specialty name below' : 'Add a new specialty for your team members' }}</p>
    </div>
  </div>
</div>

@if (fetchLoading()) {
  <div class="state-row">
    <div class="spinner"></div>
    <span>Loading specialty...</span>
  </div>
} @else {
  <form class="form-layout" (ngSubmit)="onSubmit()" #spForm="ngForm">

    @if (error()) {
      <div class="form-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    }

    <div class="form-card">
      <div class="section">
        <div class="section-head">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </div>
          <span class="section-title">Specialty name</span>
        </div>

        <div class="field">
          <label class="field-label">Name <span class="req">*</span></label>
          <input
            class="field-input"
            type="text"
            name="name"
            [(ngModel)]="name"
            required
            placeholder="e.g. Cardiology"
          />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-submit" type="submit" [disabled]="spForm.invalid || loading()">
        @if (loading()) {
          <div class="spinner-sm"></div>
          Saving...
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ isEdit ? 'Save changes' : 'Create specialty' }}
        }
      </button>
    </div>

  </form>
}
