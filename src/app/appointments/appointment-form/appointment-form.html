<div class="page-container">
  <form class="appointment-form" (ngSubmit)="onSubmit()" #apptForm="ngForm">
    <h2>{{ isEdit ? 'Редактировать заказ' : 'Создать заказ' }}</h2>

    @if (fetchLoading()) {
      <p class="status">Загрузка...</p>
    } @else {
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <div class="row">
        <div class="field">
          <label for="clientName">Имя клиента <span class="required">*</span></label>
          <input id="clientName" type="text" name="clientName" [(ngModel)]="clientName" required placeholder="Иван Иванов" />
        </div>
        <div class="field">
          <label for="clientPhone">Телефон клиента</label>
          <input id="clientPhone" type="tel" name="clientPhone" [(ngModel)]="clientPhone" placeholder="+7 900 000 00 00" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="serviceId">Услуга <span class="required">*</span></label>
          <select id="serviceId" name="serviceId" [(ngModel)]="serviceId" required [disabled]="refsLoading()">
            <option value="">{{ refsLoading() ? 'Загрузка...' : '— Выберите услугу —' }}</option>
            @for (svc of services(); track svc.id) {
              <option [value]="svc.id">{{ svc.title }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="employeeId">Сотрудник <span class="required">*</span></label>
          <select id="employeeId" name="employeeId" [(ngModel)]="employeeId" required [disabled]="refsLoading()">
            <option value="">{{ refsLoading() ? 'Загрузка...' : '— Выберите сотрудника —' }}</option>
            @for (emp of employees(); track emp.id) {
              <option [value]="emp.id">{{ emp.firstName }} {{ emp.lastName }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label for="startTime">Дата и время <span class="required">*</span></label>
        <input id="startTime" type="datetime-local" name="startTime" [(ngModel)]="startTime" required />
      </div>

      <div class="field">
        <label for="notes">Примечания</label>
        <textarea id="notes" name="notes" [(ngModel)]="notes" placeholder="Дополнительная информация" rows="3"></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Отмена</button>
        <button type="submit" [disabled]="apptForm.invalid || loading()">
          {{ loading() ? 'Сохранение...' : (isEdit ? 'Сохранить' : 'Создать') }}
        </button>
      </div>
    }
  </form>
</div>
