<div class="field">
  @if (label()) {
    <label class="field-label">
      {{ label() }}
      @if (required()) { <span class="req">*</span> }
    </label>
  }

  <div
    class="input-wrap"
    [class.has-eye]="type() === 'password'"
    [class.has-prefix]="prefix()"
    [class.has-suffix]="suffix()"
  >
    @if (prefix()) {
      <span class="adornment adornment--prefix">{{ prefix() }}</span>
    }

    <input
      class="input"
      [type]="resolvedType"
      [placeholder]="placeholder()"
      [value]="value() ?? ''"
      (input)="onInput($any($event.target).value)"
    />

    @if (suffix()) {
      <span class="adornment adornment--suffix">{{ suffix() }}</span>
    }

    @if (type() === 'password') {
      <button
        type="button"
        class="eye-btn"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        @if (!showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        }
      </button>
    }
  </div>

  @if (hint()) {
    <span class="field-hint">{{ hint() }}</span>
  }
</div>
