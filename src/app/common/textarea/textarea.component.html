<div class="field">
  @if (label()) {
    <label class="field-label">
      {{ label() }}
      @if (required()) { <span class="req">*</span> }
    </label>
  }

  <textarea
    class="textarea"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
  ></textarea>

  @if (hint()) {
    <span class="field-hint">{{ hint() }}</span>
  }
</div>
