<div class="page-container">
  <form class="service-form" (ngSubmit)="onSubmit()" #svcForm="ngForm">
    <h2>{{ isEdit ? 'Редактировать услугу' : 'Создать услугу' }}</h2>

    @if (fetchLoading()) {
      <p class="status">Загрузка...</p>
    } @else {
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <div class="field">
        <label for="title">Название <span class="required">*</span></label>
        <input id="title" type="text" name="title" [(ngModel)]="title" required placeholder="Название услуги" />
      </div>

      <div class="field">
        <label for="description">Описание <span class="required">*</span></label>
        <textarea id="description" name="description" [(ngModel)]="description" required placeholder="Описание услуги" rows="3"></textarea>
      </div>

      <div class="field">
        <label for="photo">Фото (URL)</label>
        <input id="photo" type="url" name="photo" [(ngModel)]="photo" placeholder="https://example.com/photo.jpg" />
      </div>

      <div class="row">
        <div class="field">
          <label for="price">Цена <span class="required">*</span></label>
          <input id="price" type="number" name="price" [(ngModel)]="price" required min="0" step="0.01" placeholder="0.00" />
        </div>

        <div class="field">
          <label for="duration">Длительность, мин <span class="required">*</span></label>
          <input id="duration" type="number" name="duration" [(ngModel)]="duration" required min="1" placeholder="30" />
        </div>

        <div class="field">
          <label for="durationMax">Макс. длительность, мин</label>
          <input id="durationMax" type="number" name="durationMax" [(ngModel)]="durationMax" min="1" placeholder="60" />
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Отмена</button>
        <button type="submit" [disabled]="svcForm.invalid || loading()">
          {{ loading() ? 'Сохранение...' : (isEdit ? 'Сохранить' : 'Создать') }}
        </button>
      </div>
    }
  </form>
</div>
